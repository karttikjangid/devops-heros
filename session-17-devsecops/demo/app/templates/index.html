<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Session 17 Calculator</title></head>
<body><h1>Session 17 Calculator</h1><p>Kartik's CI/CD &amp; DevSecOps demo</p>
<form id="calculator"><label>First number <input name="a" type="number" step="any" required></label>
<label>Operation <select name="operation"><option>add</option><option>subtract</option><option>multiply</option><option>divide</option></select></label>
<label>Second number <input name="b" type="number" step="any" required></label><button>Calculate</button></form>
<p id="result" role="status"></p><p>Pipeline evidence is recorded in GitHub Actions.</p>
<script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));const response=await fetch('/api/calculate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();document.querySelector('#result').textContent=response.ok?'Result: '+result.result:result.error;});</script></body></html>
