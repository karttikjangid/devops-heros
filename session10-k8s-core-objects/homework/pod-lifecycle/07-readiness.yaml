apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-readiness
  namespace: session10-lab
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
    imagePullPolicy: IfNotPresent
