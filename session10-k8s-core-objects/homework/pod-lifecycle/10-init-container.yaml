apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
  namespace: session10-lab
spec:
  initContainers:
  - name: setup
    image: busybox:1.36
    command:
    - sh
    - -c
    - echo 'Init container running'; sleep 10; echo 'Init complete'
    imagePullPolicy: IfNotPresent
  containers:
  - name: app
    image: nginx:1.27
    imagePullPolicy: IfNotPresent
