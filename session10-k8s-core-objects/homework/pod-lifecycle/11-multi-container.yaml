apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi-container
  namespace: session10-lab
spec:
  containers:
  - name: app
    image: nginx:1.27
    imagePullPolicy: IfNotPresent
  - name: sidecar
    image: busybox:1.36
    command:
    - sh
    - -c
    - while true; do echo 'Sidecar is running'; sleep 10; done
    imagePullPolicy: IfNotPresent
