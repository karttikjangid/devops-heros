apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: session14-lab
spec:
  containers:
  - name: client
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
