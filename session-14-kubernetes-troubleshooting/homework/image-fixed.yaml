apiVersion: v1
kind: Pod
metadata:
  name: image
  namespace: session14-lab
spec:
  containers:
  - name: app
    image: nginxinc/nginx-unprivileged:stable-alpine
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
