apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: production-webapp
spec:
  containers:
  - name: load
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - for worker in 1 2 3 4 5 6 7 8; do (while true; do wget -qO- http://web-service
      >/dev/null; done) & done; wait
    resources:
      requests:
        cpu: 10m
        memory: 8Mi
      limits:
        cpu: 300m
        memory: 32Mi
