apiVersion: v1
kind: Pod
metadata:
  name: volume-demo
  namespace: production-webapp
spec:
  containers:
  - name: demo
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - sleep 3600
    volumeMounts:
    - name: cache
      mountPath: /cache
    - name: node
      mountPath: /node
  volumes:
  - name: cache
    emptyDir: {}
  - name: node
    hostPath:
      path: /tmp/session13-homework
      type: DirectoryOrCreate
