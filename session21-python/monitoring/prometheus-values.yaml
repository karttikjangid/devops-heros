alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
server:
  retention: 1h
  persistentVolume:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 300m, memory: 384Mi}
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: homework
        scrape_interval: 5s
        static_configs:
          - targets: ['backend.session21.svc.cluster.local:8000']
