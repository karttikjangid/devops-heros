service:
  type: ClusterIP
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {cpu: 200m, memory: 192Mi}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://session21-prometheus-server.session21-monitoring.svc.cluster.local
        isDefault: true
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: homework
        orgId: 1
        folder: Homework
        type: file
        options:
          path: /var/lib/grafana/dashboards/homework
dashboards:
  homework:
    requests:
      json: |
        {"title":"Session 21 HTTP requests","uid":"session21","schemaVersion":39,"version":1,"refresh":"5s","panels":[{"id":1,"title":"Backend requests","type":"stat","gridPos":{"h":8,"w":12,"x":0,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(http_requests_total{job=\"homework\"})","refId":"A"}],"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]}}}],"time":{"from":"now-15m","to":"now"}}
