apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session21
  namespace: argocd
spec:
  project: session21
  source:
    repoURL: https://github.com/karttikjangid/devops-heros.git
    targetRevision: main
    path: session21-python/helm/taskboard
    helm:
      releaseName: homework
      valueFiles: [values-gitops.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: session21
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
