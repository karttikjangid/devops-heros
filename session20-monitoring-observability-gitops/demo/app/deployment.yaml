apiVersion: apps/v1
kind: Deployment
metadata:
  name: session20-web
  namespace: session20
spec:
  replicas: 3
  selector:
    matchLabels: {app: session20-web}
  template:
    metadata:
      labels: {app: session20-web}
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
          livenessProbe:
            httpGet: {path: /, port: 8080}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
