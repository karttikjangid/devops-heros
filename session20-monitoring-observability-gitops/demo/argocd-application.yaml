apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-demo
  namespace: session20-argocd
spec:
  project: session20
  source:
    repoURL: https://github.com/karttikjangid/devops-heros.git
    targetRevision: main
    path: session20-monitoring-observability-gitops/demo/app
  destination:
    server: https://kubernetes.default.svc
    namespace: session20
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
