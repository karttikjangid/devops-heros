apiVersion: apps/v1
kind: Deployment
metadata:
  name: services-web
  namespace: session11-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: services-web
  template:
    metadata:
      labels:
        app: services-web
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
